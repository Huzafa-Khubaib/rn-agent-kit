[metadata]
name = screenshot-to-rn-mcp
version = 0.1.0

[options]
packages = find:
python_requires = >=3.10
install_requires =
    mcp>=1.6.0
    websockets>=14.0

[options.packages.find]
include =
    screenshot_to_rn_mcp*

[options.entry_points]
console_scripts =
    screenshot-to-rn-mcp = screenshot_to_rn_mcp.server:main
