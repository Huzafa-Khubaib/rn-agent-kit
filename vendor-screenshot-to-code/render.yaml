# Render Blueprint — screenshot-to-rn hosted MCP (Figma-style URL)
# Dashboard: https://dashboard.render.com → New → Blueprint → connect this repo
# Root directory / docker context: vendor-screenshot-to-code (or whole monorepo with dockerfilePath below)
#
# After deploy, Cursor mcp.json:
# {
#   "mcpServers": {
#     "screenshot-to-rn": {
#       "url": "https://<service>.onrender.com/mcp",
#       "headers": { "Authorization": "Bearer <MCP_API_KEY>" }
#     }
#   }
# }

services:
  - type: web
    name: screenshot-to-rn-mcp
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile.hosted
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: BACKEND_PORT
        value: "7001"
      - key: SCREENSHOT_TO_CODE_WS_URL
        value: ws://127.0.0.1:7001
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MCP_API_KEY
        sync: false
      - key: MCP_ALLOWED_HOSTS
        value: "*"
